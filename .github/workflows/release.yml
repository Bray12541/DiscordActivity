name: Publish Discord Activity

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained executable
        shell: pwsh
        run: >
          dotnet publish DiscordActivity.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "release\DiscordActivity.exe").Hash.ToLowerInvariant()
          "$hash  DiscordActivity.exe" | Set-Content -Encoding ascii "release\DiscordActivity.sha256"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release\DiscordActivity.exe" `
            "release\DiscordActivity.sha256" `
            --verify-tag `
            --generate-notes `
            --title "${{ github.ref_name }}"
